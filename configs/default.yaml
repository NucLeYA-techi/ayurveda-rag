paths:
  data_dir: data
  raw_dir: data/raw
  index_dir: data/index
  artifacts_dir: data/artifacts

llm:
  base_url: http://127.0.0.1:8000/v1
  model: deepseek-v4.1-flash-free
  judge_model: glm-5.3-flash-free
  api_key_env: AYURRAG_LLM_API_KEY
  temperature: 0.1
  max_tokens: 1800
  timeout: 180
  max_retries: 4

embedding:
  model: BAAI/bge-small-en-v1.5
  multilingual_model: intfloat/multilingual-e5-small
  batch_size: 32
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""

retrieval:
  bm25_top_k: 60
  dense_top_k: 60
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 1.0
  rerank_top_n: 50
  final_top_k: 8
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  enable_rerank: true
  graph_expansion: true
  graph_top_k: 20

chunking:
  max_chars: 1400
  overlap_chars: 180
  min_chars: 40

eval:
  judge_model: glm-5.3-flash-free
  sample_size: 200
  seed: 13
