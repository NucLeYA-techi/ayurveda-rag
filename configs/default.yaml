paths:
  data_dir: data
  raw_dir: data/raw
  index_dir: data/index
  artifacts_dir: data/artifacts

llm:
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-pro
  judge_model: deepseek-flash
  api_key_env: AYURRAG_LLM_API_KEY
  temperature: 0.1
  max_tokens: 1800
  timeout: 180
  max_retries: 4

embedding:
  model: BAAI/bge-small-en-v1.5
  multilingual_model: intfloat/multilingual-e5-small
  batch_size: 32
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""

retrieval:
  bm25_top_k: 60
  dense_top_k: 60
  rrf_k: 60
  bm25_weight: 0.8
  dense_weight: 0.2
  fusion: convex
  candidate_top_k: 120
  rerank_top_n: 80
  rerank_blend: 0.5
  final_top_k: 8
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  enable_rerank: true
  graph_expansion: false
  graph_top_k: 20
  graph_weight: 0.08
  graph_hops: 1
  query_expansion: true
  max_subqueries: 0
  alias_weight: 0.3
  subquery_weight: 0.2
  mmr: false
  mmr_lambda: 0.75
  mmr_pool: 24

chunking:
  max_chars: 1400
  overlap_chars: 180
  min_chars: 40

eval:
  judge_model: deepseek-flash
  sample_size: 200
  seed: 13
